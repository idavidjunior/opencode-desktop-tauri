name: Build Desktop Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.17.17)"
        required: false
        type: string
      channel:
        description: "Release channel"
        required: false
        type: choice
        options:
          - prod
          - beta
        default: prod

permissions:
  contents: write
  id-token: write

env:
  OPENCODE_CHANNEL: ${{ github.event.inputs.channel || 'prod' }}

jobs:
  build-desktop-windows:
    name: Build Windows Desktop (Tauri)
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            packages/**/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'packages/**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: bun install
        working-directory: ${{ github.workspace }}

      - name: Build CLI (required for sidecar)
        run: bun run packages/opencode/script/build.ts
        working-directory: ${{ github.workspace }}

      - name: Prepare desktop build
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        env:
          OPENCODE_VERSION: ${{ github.event.inputs.version || 'dev' }}
          OPENCODE_CHANNEL: ${{ env.OPENCODE_CHANNEL }}
          OPENCODE_CLI_ARTIFACT: opencode-cli-windows
          RUST_TARGET: x86_64-pc-windows-msvc
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Build Desktop (Tauri)
        run: bun run tauri:build
        working-directory: packages/desktop
        timeout-minutes: 45
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_CHANNEL: ${{ env.OPENCODE_CHANNEL }}
          RUST_TARGET: x86_64-pc-windows-msvc

      - name: Find build artifacts
        id: artifacts
        shell: pwsh
        run: |
          $distPath = "${{ github.workspace }}\packages\desktop\src-tauri\target\release\bundle"
          $files = @()
          
          # MSI installer
          $msi = Get-ChildItem "$distPath\msi" -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue
          if ($msi) { $files += $msi.FullName }
          
          # NSIS installer (.exe)
          $nsis = Get-ChildItem "$distPath\nsis" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
          if ($nsis) { $files += $nsis.FullName }
          
          # Portable .exe
          $portable = Get-ChildItem "$distPath\exe" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
          if ($portable) { $files += $portable.FullName }
          
          # Also check root bundle dir
          $rootExe = Get-ChildItem "$distPath" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
          if ($rootExe) { $files += $rootExe.FullName }
          
          if ($files.Count -eq 0) {
            Write-Error "No build artifacts found in $distPath"
            exit 1
          }
          
          $uniqueFiles = $files | Select-Object -Unique
          Write-Output "Found $($uniqueFiles.Count) artifact(s):"
          $uniqueFiles | ForEach-Object { Write-Output "  $_" }
          
          echo "files<<EOF" >> $env:GITHUB_OUTPUT
          $uniqueFiles | ForEach-Object { echo $_ } >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

      - name: Upload Windows Desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-windows-${{ github.event.inputs.version || 'dev' }}
          path: ${{ steps.artifacts.outputs.files }}
          retention-days: 30

      - name: Create GitHub Release (if version provided)
        if: github.event.inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: OpenCode Desktop ${{ github.event.inputs.version }}
          draft: false
          prerelease: ${{ github.event.inputs.channel == 'beta' }}
          files: ${{ steps.artifacts.outputs.files }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}